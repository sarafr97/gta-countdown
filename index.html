
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Atrás GTA VI</title>
    <!-- Fuente estilo neón/gaming -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d12;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo con ambiente Vice City (Cyan y Fucsia) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 0, 128, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 243, 255, 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff0080, #00f3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 128, 0.4);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a0a0b0;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Contenedor del Reloj */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .time-box {
            background: rgba(20, 20, 30, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 20px 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
        }

        .time-box::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, #ff0080, #00f3ff);
        }

        .time-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 5px;
        }

        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f3ff;
            font-weight: 700;
        }

        /* Caja de frases divertidas */
        .quote-box {
            background: rgba(255, 0, 128, 0.05);
            border: 1px dashed rgba(255, 0, 128, 0.4);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-style: italic;
            color: #ff80bf;
            font-size: 0.95rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Botón de compartir o broma */
        .btn {
            background: linear-gradient(135deg, #ff0080, #7928ca);
            color: white;
            border: none;
            padding: 12px 24px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #666680;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GTA VI Countdown</h1>
        <div class="subtitle">La cuenta atrás oficial para perder la vida social</div>

        <div class="countdown-grid">
            <div class="time-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Días</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Horas</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutos</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Segundos</div>
            </div>
        </div>

        <div class="quote-box" id="quote">
            "CADA VEZ QUEDA MENOS..."
        </div>
    
        <div class="footer-note">Hecho con amor</div>
    </div>

    <script>
        // Fecha estimada de lanzamiento de GTA VI 
        const targetDate = new Date(2026, 10, 19, 0, 0, 0).getTime(); 


        function actualizarReloj() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                document.getElementById("quote").innerText = "¡YA HA SALIDO! (Si sigues vivo, felicidades)";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

        }

        // Ejecutar el reloj cada segundo
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>
</body>
</html>
